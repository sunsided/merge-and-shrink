# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[files]
extend-exclude = [
  "*.lock",
  "fuzz/corpus/**",
  "fuzz/artifacts/**",
  "**/proptest-regressions/**",
  "LICENSES/**",
  # Third-party PDDL and translator output, kept verbatim.
  "tests/fixtures/**",
]

[default.extend-words]
# Project-specific words typos flags wrongly, e.g. `ser = "ser"`. Keep each entry justified.
# Accepted variant spelling; used in commit 84f1c6f on main, which release-plz copies into CHANGELOG.md.
unparseable = "unparseable"

[default.extend-identifiers]
