[package]
name = "merge-and-shrink"
description = "Merge-and-shrink abstraction heuristics for factored transition systems"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/sunsided/merge-and-shrink"
readme = "README.md"
keywords = ["planning", "merge-and-shrink", "heuristic", "abstraction", "fast-downward"]
categories = ["algorithms", "science"]
# GPL-2.0-or-later test inputs and their license text; see tests/fixtures/README.md
exclude = ["tests/fixtures/translated", "LICENSES/GPL-2.0-or-later.txt"]

[dependencies]
sas-plus = { version = "0.1.0" }

[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.11.0"

[[bench]]
name = "construction"
harness = false
